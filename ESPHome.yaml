esphome:
  name: huawei-r4850
  friendly_name: Huawei R4850

external_components:
  - source: github://jn30/esphome-huawei-r4850
esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    canbus: INFO

# Enable Home Assistant API
api:
  encryption:
    key: "UV8TG+QH0AfZ5z8M06ka28Hc8bfwjW0oOpOIMDloV/M="

ota:
- platform: esphome
  password: "96cb0313567f4b049223bb2f5d57bf36"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
   # Optional manual IP
  #manual_ip:
 #   static_ip: 192.168.0.144
 #   gateway: 192.168.0.1
 #  subnet: 255.255.255.0
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Huawei-R4850 Fallback Hotspot"
    password: "3d25h1MMY8Av"

#captive_portal:
web_server:

canbus:
  - platform: esp32_can
    id: can
    tx_pin: GPIO16 #blue
    rx_pin: GPIO17 #green
    use_extended_id: true
    can_id: 0
    bit_rate: 125kbps


huawei_r4850:
  canbus_id: can
  update_interval: 5s

sensor:
  - platform: huawei_r4850
    output_voltage:
      name: Output voltage
    output_current:
      name: Output current
    output_power:
      name: Output power
    input_voltage:
      name: Input voltage
    input_current:
      name: Input current
    input_power:
      name: Input power
    input_frequency:
      name: Input frequency
    efficiency:
      name: Efficiency
    input_temp:
      name: Input temperature
    output_temp:
      name: Output temperature
    

number:
  - platform: huawei_r4850
    output_voltage:
      name: Set output voltage
    max_output_current:
      name: Max output current

button:
  - platform: huawei_r4850
    set_offline_values:
      name: Set offline values

switch:
  - platform: restart
    name: "Huawei Control Restart"      
